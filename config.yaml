llm:
  models:
    - name: gpt-5.5
      provider: openai-compatible
      api_key: ${APP_LLM_API_KEY}
      base_url: ${APP_LLM_BASE_URL}
      model: gpt-5.5
      priority: 1
    - name: qwen-tools
      provider: openai-compatible
      api_key: ${APP_QWEN_API_KEY}
      base_url: ${APP_QWEN_BASE_URL}
      model: qwen2.5:7b
      priority: 10

agent:
  tool_model: qwen-tools

memory:
  session_ttl: 720h
  semantic_collection: semantic_memory_v1
  semantic_top_k: 5
  extraction_timeout: 10s
  extraction_min_importance: 0.7
  extraction_max_items: 5

context:
  max_input_tokens: 30000
  recent_messages: 20
  summary_max_tokens: 2000

tools:
  lazy_load_threshold: 3
  max_discovery_calls: 4

document:
  docling_url: http://localhost:5001
  parse_timeout: 10m
