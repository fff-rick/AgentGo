services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${APP_POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${APP_POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${APP_POSTGRES_DBNAME:-ai_agent}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${APP_POSTGRES_USER:-postgres} -d ${APP_POSTGRES_DBNAME:-ai_agent}"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 15

  etcd:
    image: quay.io/coreos/etcd:v3.5.18
    command: >-
      etcd -advertise-client-urls=http://etcd:2379
      -listen-client-urls http://0.0.0.0:2379
      --data-dir /etcd
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: 1000
      ETCD_QUOTA_BACKEND_BYTES: 4294967296
      ETCD_SNAPSHOT_COUNT: 50000
    volumes:
      - etcd-data:/etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio:
    image: minio/minio:RELEASE.2024-05-28T17-19-04Z
    command: ["minio", "server", "/minio_data", "--console-address", ":9001"]
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    volumes:
      - minio-data:/minio_data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 20

  milvus-standalone:
    image: ${MILVUS_IMAGE:-milvusdb/milvus:v2.5.27}
    command: ["milvus", "run", "standalone"]
    security_opt:
      - seccomp:unconfined
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
      MINIO_REGION: us-east-1
    volumes:
      - milvus-data:/var/lib/milvus
    ports:
      - "${MILVUS_PORT:-19530}:19530"
      - "${MILVUS_WEBUI_PORT:-19121}:9091"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 5s
      start_period: 30s
      timeout: 5s
      retries: 30
    depends_on:
      etcd:
        condition: service_healthy
      minio:
        condition: service_healthy

  searxng:
    image: ${SEARXNG_IMAGE:-searxng/searxng:latest}
    environment:
      SEARXNG_SECRET: ${SEARXNG_SECRET:-agentgo-local-search-change-me}
      SEARXNG_BASE_URL: http://localhost:${SEARXNG_PORT:-7070}/
    volumes:
      - ./deploy/searxng/settings.yml:/etc/searxng/settings.yml:ro
      - searxng-cache:/var/cache/searxng
    ports:
      - "${SEARXNG_PORT:-7070}:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/ >/dev/null || exit 1"]
      interval: 5s
      start_period: 10s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  docling:
    image: ghcr.io/docling-project/docling-serve-cpu:v1.29.0
    environment:
      DOCLING_SERVE_MAX_SYNC_WAIT: 600
    ports:
      - "${DOCLING_PORT:-5001}:5001"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:5001/health >/dev/null"]
      interval: 10s
      start_period: 60s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  agentgo:
    image: ${AGENTGO_IMAGE:-ai-agent-go:local}
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${AGENTGO_BIND_HOST:-127.0.0.1}:${AGENTGO_PORT:-8080}:8080"
    environment:
      APP_AUTH_ENABLED: ${APP_AUTH_ENABLED:-false}
      APP_AUTH_ISSUER: ${APP_AUTH_ISSUER:-}
      APP_AUTH_AUDIENCE: ${APP_AUTH_AUDIENCE:-}
      APP_ENV: ${APP_ENV:-development}
      APP_SERVER_MODE: ${APP_SERVER_MODE:-release}
      APP_SERVER_READ_TIMEOUT: ${APP_SERVER_READ_TIMEOUT:-60s}
      APP_SERVER_WRITE_TIMEOUT: ${APP_SERVER_WRITE_TIMEOUT:-300s}
      APP_AGENT_ENABLE_REFLECTION: ${APP_AGENT_ENABLE_REFLECTION:-false}
      APP_REDIS_ADDR: redis:6379
      APP_REDIS_PASSWORD: ${APP_REDIS_PASSWORD:-}
      APP_REDIS_DB: ${APP_REDIS_DB:-0}
      APP_REDIS_POOL_SIZE: ${APP_REDIS_POOL_SIZE:-20}
      APP_MILVUS_ADDR: milvus-standalone:19530
      APP_MILVUS_USERNAME: ${APP_MILVUS_USERNAME:-}
      APP_MILVUS_PASSWORD: ${APP_MILVUS_PASSWORD:-}
      APP_MILVUS_DATABASE: ${APP_MILVUS_DATABASE:-default}
      APP_MILVUS_COLLECTION_NAME: ${APP_MILVUS_COLLECTION_NAME:-documents_bge_m3}
      APP_MILVUS_DIMENSION: ${APP_MILVUS_DIMENSION:-1024}
      APP_MILVUS_METRIC_TYPE: ${APP_MILVUS_METRIC_TYPE:-COSINE}
      APP_MILVUS_CONNECT_TIMEOUT: ${APP_MILVUS_CONNECT_TIMEOUT:-60s}
      APP_POSTGRES_HOST: postgres
      APP_POSTGRES_PORT: 5432
      APP_POSTGRES_USER: ${APP_POSTGRES_USER:-postgres}
      APP_POSTGRES_PASSWORD: ${APP_POSTGRES_PASSWORD:-postgres}
      APP_POSTGRES_DBNAME: ${APP_POSTGRES_DBNAME:-ai_agent}
      APP_POSTGRES_SSL_MODE: ${APP_POSTGRES_SSL_MODE:-disable}
      APP_POSTGRES_QUERY_TIMEOUT: ${APP_POSTGRES_QUERY_TIMEOUT:-10s}
      APP_POSTGRES_MAX_ROWS: ${APP_POSTGRES_MAX_ROWS:-100}
      APP_LLM_BASE_URL: ${APP_LLM_BASE_URL:-}
      APP_LLM_API_KEY: ${APP_LLM_API_KEY:-}
      APP_QWEN_BASE_URL: ${APP_QWEN_BASE_URL:-http://host.docker.internal:11434}
      APP_QWEN_API_KEY: ${APP_QWEN_API_KEY:-ollama}
      APP_LLM_REQUEST_TIMEOUT: ${APP_LLM_REQUEST_TIMEOUT:-180s}
      APP_EMBEDDING_BASE_URL: ${APP_EMBEDDING_BASE_URL:-http://host.docker.internal:11434}
      APP_EMBEDDING_MODEL: ${APP_EMBEDDING_MODEL:-bge-m3:latest}
      APP_EMBEDDING_DIMENSION: ${APP_EMBEDDING_DIMENSION:-1024}
      APP_EMBEDDING_BATCH_SIZE: ${APP_EMBEDDING_BATCH_SIZE:-32}
      APP_EMBEDDING_TIMEOUT: ${APP_EMBEDDING_TIMEOUT:-120s}
      APP_RAG_SCORE_THRESHOLD: ${APP_RAG_SCORE_THRESHOLD:-0.5}
      APP_RAG_ENABLE_RERANK: ${APP_RAG_ENABLE_RERANK:-true}
      APP_SEARCH_BASE_URL: http://searxng:8080
      APP_SEARCH_TIMEOUT: ${APP_SEARCH_TIMEOUT:-20s}
      APP_SEARCH_LANGUAGE: ${APP_SEARCH_LANGUAGE:-zh-CN}
      APP_SEARCH_SAFE_SEARCH: ${APP_SEARCH_SAFE_SEARCH:-1}
      APP_DOCUMENT_DOCLING_URL: http://docling:5001
      APP_DOCUMENT_PARSE_TIMEOUT: ${APP_DOCUMENT_PARSE_TIMEOUT:-10m}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      milvus-standalone:
        condition: service_healthy
      searxng:
        condition: service_healthy
      docling:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
  etcd-data:
  minio-data:
  milvus-data:
  searxng-cache:
