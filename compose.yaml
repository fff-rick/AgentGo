services:
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 15

  etcd:
    image: quay.io/coreos/etcd:v3.5.18
    command: >-
      etcd -advertise-client-urls=http://etcd:2379
      -listen-client-urls http://0.0.0.0:2379
      --data-dir /etcd
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: 1000
      ETCD_QUOTA_BACKEND_BYTES: 4294967296
      ETCD_SNAPSHOT_COUNT: 50000
    volumes:
      - etcd-data:/etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 5s
      timeout: 5s
      retries: 20

  minio:
    image: minio/minio:RELEASE.2024-05-28T17-19-04Z
    command: ["minio", "server", "/minio_data", "--console-address", ":9001"]
    environment:
      MINIO_ACCESS_KEY: minioadmin
      MINIO_SECRET_KEY: minioadmin
    volumes:
      - minio-data:/minio_data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 20

  milvus-standalone:
    image: ${MILVUS_IMAGE:-milvusdb/milvus:v2.5.27}
    command: ["milvus", "run", "standalone"]
    security_opt:
      - seccomp:unconfined
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
      MINIO_REGION: us-east-1
    volumes:
      - milvus-data:/var/lib/milvus
    ports:
      - "${MILVUS_PORT:-19530}:19530"
      - "${MILVUS_WEBUI_PORT:-9091}:9091"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 5s
      start_period: 30s
      timeout: 5s
      retries: 30
    depends_on:
      etcd:
        condition: service_healthy
      minio:
        condition: service_healthy

  agentgo:
    image: ${AGENTGO_IMAGE:-ai-agent-go:local}
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "${AGENTGO_PORT:-8080}:8080"
    environment:
      APP_ENV: ${APP_ENV:-development}
      APP_SERVER_MODE: ${APP_SERVER_MODE:-release}
      APP_SERVER_READ_TIMEOUT: ${APP_SERVER_READ_TIMEOUT:-60s}
      APP_SERVER_WRITE_TIMEOUT: ${APP_SERVER_WRITE_TIMEOUT:-300s}
      APP_AGENT_ENABLE_REFLECTION: ${APP_AGENT_ENABLE_REFLECTION:-false}
      APP_REDIS_ADDR: redis:6379
      APP_REDIS_PASSWORD: ${APP_REDIS_PASSWORD:-}
      APP_REDIS_DB: ${APP_REDIS_DB:-0}
      APP_REDIS_POOL_SIZE: ${APP_REDIS_POOL_SIZE:-20}
      APP_MILVUS_ADDR: milvus-standalone:19530
      APP_MILVUS_USERNAME: ${APP_MILVUS_USERNAME:-}
      APP_MILVUS_PASSWORD: ${APP_MILVUS_PASSWORD:-}
      APP_MILVUS_DATABASE: ${APP_MILVUS_DATABASE:-default}
      APP_MILVUS_COLLECTION_NAME: ${APP_MILVUS_COLLECTION_NAME:-documents_bge_m3}
      APP_MILVUS_DIMENSION: ${APP_MILVUS_DIMENSION:-1024}
      APP_MILVUS_METRIC_TYPE: ${APP_MILVUS_METRIC_TYPE:-COSINE}
      APP_MILVUS_CONNECT_TIMEOUT: ${APP_MILVUS_CONNECT_TIMEOUT:-60s}
      APP_LLM_BASE_URL: ${APP_LLM_BASE_URL:-}
      APP_LLM_API_KEY: ${APP_LLM_API_KEY:-}
      APP_LLM_MODEL: ${APP_LLM_MODEL:-}
      APP_LLM_NAME: ${APP_LLM_NAME:-}
      APP_LLM_PROVIDER: ${APP_LLM_PROVIDER:-openai-compatible}
      APP_LLM_REQUEST_TIMEOUT: ${APP_LLM_REQUEST_TIMEOUT:-180s}
      APP_EMBEDDING_BASE_URL: ${APP_EMBEDDING_BASE_URL:-http://host.docker.internal:11434}
      APP_EMBEDDING_MODEL: ${APP_EMBEDDING_MODEL:-bge-m3:latest}
      APP_EMBEDDING_DIMENSION: ${APP_EMBEDDING_DIMENSION:-1024}
      APP_EMBEDDING_BATCH_SIZE: ${APP_EMBEDDING_BATCH_SIZE:-32}
      APP_EMBEDDING_TIMEOUT: ${APP_EMBEDDING_TIMEOUT:-120s}
    depends_on:
      redis:
        condition: service_healthy
      milvus-standalone:
        condition: service_healthy
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped

volumes:
  redis-data:
  etcd-data:
  minio-data:
  milvus-data:
